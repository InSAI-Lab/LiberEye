name: Source validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0
      - run: python -m pip install -c constraints.txt '.[dev,hardware]'
      - run: python -m pytest tests -q
      - run: python ../scripts/validate_epmc.py
      - run: python -m build
      - run: python scripts/configure_cloud.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: python scripts/smoke_cloud.py
      - if: always()
        run: docker compose down
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests
      - run: python scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: libereye-source
          path: dist/*
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ./firmware/libereye_wrist/scripts/test.sh
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - run: ./firmware/libereye_wrist/scripts/install-dependencies.sh
      - run: ./firmware/libereye_wrist/scripts/build.sh
  ios-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./ios/Scripts/test_contract.sh
