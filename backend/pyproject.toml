[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libereye"
version = "0.2.0"
description = "LiberEye EPMC research implementation for speech and wrist haptic coordination"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "pillow>=10.4,<13",
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.18,<1",
  "pytesseract>=0.3.13,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2", "pyyaml>=6,<7"]
hardware = ["pyserial>=3.5,<4", "bleak>=0.22,<4"]
vision = ["ultralytics>=8.3.237,<9"]

[tool.setuptools.packages.find]
include = ["libereye*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
