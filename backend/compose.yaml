services:
  api:
    build:
      context: .
      args:
        INSTALL_VISION: ${INSTALL_VISION:-0}
    image: libereye-cloud:local
    env_file: .env
    environment:
      LIBEREYE_HOST: 0.0.0.0
      LIBEREYE_PORT: 8080
      LIBEREYE_ALLOW_INSECURE: '0'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./models:/models:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${LIBEREYE_MEMORY_LIMIT:-4g}
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
